# Smoke / short-run configuration (NOT identical to TrainConfig code defaults).
# Prefer code defaults or runs/optuna/best_config.yaml for full experiments.

data:
  data_dir: "data/smoke_test_6shard/"
  pattern: "*.h5"
  I_key: "I"
  phi_key: "phi"
  val_frac: 0.3
  workers: 4
  persistent_workers: false
  augment: true

aug:
  enable: true
  warmup_ratio: 0.1
  full_ratio: 0.4
  profile: "cosine"

model:
  base: 16
  activation: "silu"
  final_dropout: 0.3
  ema_decay: 0.999
  device: "auto"
  use_amp: false

optim:
  epochs: 10
  batch_size: 8
  lr: 3.0e-4
  eta_min: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 5.0
  warmup_steps: 500

loss:
  w_mae: 1.0
  w_grad: 0.1
  int_wgrad: false
  w_curv: 0.003
  w_data: 1.0

logging:
  run_name: "default"
  runs_root: "runs"
  vis_max: 8
  val_interval: 1
  seed: 1337
