data:
  backend: "otf"
  observation: "wrapped_dp"
  steps_per_epoch: 100
  val_batches: 8
  test_batches: 8
  workers: 0
  train_seed: 1337
  val_seed: 7331
  test_seed: 9337
  noise_seed: 12345

model:
  arch: "pclcn"
  base: 32
  reference_mode: "reference_free"
  device: "auto"
  use_amp: true
  ema_decay: 0.999

optim:
  epochs: 50
  batch_size: 64
  lr: 3.0e-4
  eta_min: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 5.0
  warmup_steps: 100
  compile: false

loss:
  w_data: 1.0
  w_curl: 0.1
  w_complex: 0.1

aug:
  enable: false

logging:
  run_name: "pclcn_wrapped_diagnostic"
  runs_root: "runs"
  vis_max: 8
  val_interval: 1
  seed: 1337
