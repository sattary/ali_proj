[project]
name = "ali-proj"
version = "1.0.0"
description = "UNetRes2 absolute phase reconstruction from interferometric data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.15.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "torch>=2.1.0",
    "torchvision",
    "torchmetrics>=1.7.0",
    "tqdm>=4.67.3",
    "typer>=0.15.0",
    "onnx>=1.17.0",
    "onnxscript>=0.2.0",
    "ipywidgets>=8.1.8",
    "wrapt>=1.16.0",
    "ipykernel>=7.3.0",
]

[project.scripts]
phun = "phase_unwrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase_unwrap"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "scikit-image>=0.26.0",
    "ruff>=0.9.9",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

